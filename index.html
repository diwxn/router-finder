<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Поиск роутера</title>

    <!-- Иконка (лупа) на вкладке браузера -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0f0f14;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(102, 126, 234, 0.15), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(118, 75, 162, 0.15), transparent 50%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #e8e8ec;
        }

        .container {
            background: #1a1a22;
            border: 1px solid #2a2a35;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #8888a0;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #2a2a35;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            background: #0f0f14;
            color: #e8e8ec;
        }

        input[type="text"]::placeholder {
            color: #55556a;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            background: #13131a;
        }

        button {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        button:hover {
            opacity: 0.9;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: scale(0.97);
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-dns {
            background: linear-gradient(135deg, #ff6b00, #ff9500);
        }

        .btn-mvideo {
            background: linear-gradient(135deg, #e6002d, #ff1f4b);
        }

        .btn-citilink {
            background: linear-gradient(135deg, #00a651, #00c853);
        }

        .btn-ozon {
            background: linear-gradient(135deg, #005bff, #3d8bff);
        }

        .btn-search-all {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .btn-google {
            background: linear-gradient(135deg, #4285f4, #34a853);
        }

        .btn-outage {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
        }

        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            color: #a0a0b8;
            background: #13131a;
            border: 1px solid #2a2a35;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-all;
            transition: all 0.3s;
        }

        .status.success {
            background: rgba(0, 200, 83, 0.1);
            border-color: rgba(0, 200, 83, 0.4);
            color: #4ade80;
        }

        .status.warning {
            background: rgba(255, 193, 7, 0.1);
            border-color: rgba(255, 193, 7, 0.4);
            color: #fbbf24;
        }

        .hint {
            margin-top: 16px;
            font-size: 13px;
            color: #66667a;
            text-align: center;
            line-height: 1.5;
        }

        .hint code {
            background: #0f0f14;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            color: #a5b4fc;
            border: 1px solid #2a2a35;
        }

        .section-title {
            font-size: 12px;
            font-weight: 600;
            color: #66667a;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 24px 0 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Поиск роутера</h1>
        <p class="subtitle">Введите модель и выберите действие</p>

        <div class="input-group">
            <input
                type="text"
                id="modelInput"
                placeholder="Например: TP-Link Archer AX55"
                autofocus
            >
        </div>

        <div class="section-title">Магазины</div>
        <div class="buttons">
            <button class="btn-dns" onclick="searchIn('dns')">DNS</button>
            <button class="btn-mvideo" onclick="searchIn('mvideo')">М.Видео</button>
            <button class="btn-citilink" onclick="searchIn('citilink')">Ситилинк</button>
            <button class="btn-ozon" onclick="searchIn('ozon')">Ozon</button>
            <button class="btn-search-all" onclick="searchAll()" style="grid-column: 1 / -1;">
                🔎 Искать во всех магазинах
            </button>
        </div>

        <div class="section-title">Инструменты</div>
        <div class="buttons">
            <button class="btn-google" onclick="searchGooglePPPoE()" style="grid-column: 1 / -1;">
                🛠 Настройка PPPoE в Google
            </button>
            <button class="btn-outage" onclick="checkOutage()" style="grid-column: 1 / -1;">
                📡 Проверить сбои на Сбой.рф
            </button>
        </div>

        <div class="status" id="status">Введите модель роутера и выберите действие</div>

        <p class="hint">
            💡 Пишите модель как на коробке, например:<br>
            <code>TP-Link Archer AX55</code> · <code>Keenetic Giga</code> · <code>Asus RT-AX88U</code>
        </p>
    </div>

    <script>
        const SHOPS = {
            dns: {
                name: "DNS",
                domain: "dns-shop.ru",
                url: (q) => `https://www.dns-shop.ru/search/?q=${encodeURIComponent(q)}`
            },
            mvideo: {
                name: "М.Видео",
                domain: "mvideo.ru",
                url: (q) => `https://www.mvideo.ru/search?q=${encodeURIComponent(q)}`
            },
            citilink: {
                name: "Ситилинк",
                domain: "citilink.ru",
                url: (q) => `https://www.citilink.ru/search/?text=${encodeURIComponent(q)}`
            },
            ozon: {
                name: "Ozon",
                domain: "ozon.ru",
                url: (q) => `https://www.ozon.ru/search/?text=${encodeURIComponent(q)}`
            }
        };

        const input = document.getElementById("modelInput");
        const status = document.getElementById("status");

        // --- Поиск в конкретном магазине ---
        function searchIn(shopKey) {
            const model = input.value.trim();

            if (!model) {
                status.textContent = "⚠️ Пожалуйста, введите модель роутера";
                status.className = "status warning";
                input.focus();
                return;
            }

            const shop = SHOPS[shopKey];
            const url = shop.url(model);

            status.innerHTML = `✅ Открываю поиск в <b>${shop.name}</b>...`;
            status.className = "status success";

            window.open(url, "_blank");
        }

        // --- Поиск во всех магазинах сразу ---
        function searchAll() {
            const model = input.value.trim();

            if (!model) {
                status.textContent = "⚠️ Пожалуйста, введите модель роутера";
                status.className = "status warning";
                input.focus();
                return;
            }

            status.innerHTML = `🔎 Открываю поиск во <b>всех магазинах</b>...`;
            status.className = "status success";

            Object.values(SHOPS).forEach((shop, index) => {
                // Небольшая задержка, чтобы браузер не блокировал всплывающие окна
                setTimeout(() => {
                    window.open(shop.url(model), "_blank");
                }, index * 150);
            });
        }

        // --- Поиск настройки PPPoE в Google ---
        function searchGooglePPPoE() {
            const model = input.value.trim();

            if (!model) {
                status.textContent = "⚠️ Введите модель роутера для поиска настроек";
                status.className = "status warning";
                input.focus();
                return;
            }

            // Кавычки вокруг модели — для точного поиска
            const query = `"${model}" настройка PPPoE`;
            const url = `https://www.google.com/search?q=${encodeURIComponent(query)}`;

            status.innerHTML = `🛠 Ищу настройки PPPoE для <b>${model}</b>...`;
            status.className = "status success";

            window.open(url, "_blank");
        }

        // --- Проверка сбоев через Сбой.рф ---
        function checkOutage() {
            const model = input.value.trim();

            // Если модель не введена — открываем общую страницу Сбой.рф
            if (!model) {
                status.innerHTML = `📡 Открываю <b>Сбой.рф</b>...`;
                status.className = "status success";
                window.open("https://sбой.рф/", "_blank");
                return;
            }

            // Пытаемся определить магазин по введённой модели (не всегда сработает)
            // По умолчанию — общая страница
            status.innerHTML = `📡 Проверяю сбои для <b>${model}</b>...`;
            status.className = "status success";

            // Открываем общую страницу Сбой.рф (там можно выбрать нужный сервис)
            window.open("https://sбой.рф/", "_blank");
        }

        // --- Enter = поиск в DNS ---
        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                searchIn("dns");
            }
            // Ctrl+Enter = искать везде
            if (e.key === "Enter" && e.ctrlKey) {
                e.preventDefault();
                searchAll();
            }
        });
    </script>
</body>
</html>
