        const MODELS = {
            "keenetic": [
                "Giga", "Giga KN-1011", "Hopper", "Hopper KN-3810",

            ],

            ],
            "mikrotik": [
                "hAP ac2", "hAP ac3", "hAP ax2", "hAP ax3",
                "RB4011", "RB5009", "CRS326", "CRS328",
                "Chateau LTE12", "Chateau 5G"
            ]
        };

        const input = document.getElementById("modelInput");
        const status = document.getElementById("status");
        const connType = document.getElementById("connType");
        const brandLogo = document.getElementById("brandLogo");
        const suggestionsBox = document.getElementById("suggestions");

        let currentLogoUrl = "";
        let activeSuggestionIndex = -1;

        // --- Расстояние Левенштейна ---
        function levenshtein(a, b) {
            if (a === b) return 0;
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;

            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    const cost = b[i - 1] === a[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[b.length][a.length];
        }

        function checkEasterEgg(modelText) {
            const text = modelText.toLowerCase().trim();
            for (const egg of EASTER_EGGS) {
                for (const trigger of egg.triggers) {
                    if (text === trigger || text.startsWith(trigger + " ")) {
                        return egg;
                    }
                    const firstWord = text.split(/[\s\-_]+/)[0];
                    if (levenshtein(firstWord, trigger) <= 1 && trigger.length > 3) {
                        return egg;
                    }
                }
            }
            return null;
        }

        function getCanonicalBrand(inputText) {
            const text = inputText.toLowerCase().trim();
            if (!text) return null;

            const firstWord = text.split(/[\s\-_]+/)[0];

            for (const brand of Object.keys(BRANDS)) {
                if (text.startsWith(brand)) return brand;
            }

            let best = null;
            let bestDist = Infinity;
            for (const brand of Object.keys(BRANDS)) {
                const brandFirstWord = brand.split(/[\s\-_]+/)[0];
                const dist = Math.min(
                    levenshtein(firstWord, brand),
                    levenshtein(firstWord, brandFirstWord)
                );
                if (dist < bestDist) {
                    bestDist = dist;
                    best = brand;
                }
            }

            const threshold = firstWord.length <= 4 ? 1 : 3;
            return bestDist <= threshold ? best : null;
        }

        function getCanonicalModel(brandKey, modelPart) {
            if (!brandKey || !modelPart) return null;

            let key = brandKey.toLowerCase();
            if (!MODELS[key] && MODELS[key.replace(/-/g, "")]) {
                key = key.replace(/-/g, "");
            }
            if (!MODELS[key]) return null;

            const text = modelPart.toLowerCase().trim();

            let best = null;
            let bestDist = Infinity;

            for (const model of MODELS[key]) {
                const modelFirstWords = model.toLowerCase().split(/\s+/).slice(0, 2).join(" ");
                const inputFirstWords = text.split(/\s+/).slice(0, 2).join(" ");

                const distShort = levenshtein(text.split(/\s+/)[0], model.toLowerCase().split(/\s+/)[0]);
                const distFull = levenshtein(inputFirstWords, modelFirstWords);
                const dist = Math.min(distShort, distFull);

                if (dist < bestDist) {
                    bestDist = dist;
                    best = model;
                }
            }

            const firstWord = text.split(/\s+/)[0];
            const threshold = firstWord.length <= 4 ? 1 : 2;

            return bestDist <= threshold ? best : null;
        }

        function prettyBrand(brandKey) {
            return brandKey
                .split("-")
                .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                .join("-");
        }

        function updateSuggestions() {
            const value = input.value.trim();
            suggestionsBox.innerHTML = "";
            suggestionsBox.classList.remove("visible");
            activeSuggestionIndex = -1;

            if (!value) return;

            const egg = checkEasterEgg(value);
            if (egg) {
                showSuggestion("MikroTik", "шутка", true);
                return;
            }

            const parts = value.split(/\s+/);
            const rest = parts.slice(1).join(" ");
            const brandKey = getCanonicalBrand(value);

            if (brandKey && rest) {
                const canonicalModel = getCanonicalModel(brandKey, rest);
                if (canonicalModel) {
                    const suggested = `${prettyBrand(brandKey)} ${canonicalModel}`;
                    if (suggested.toLowerCase() !== value.toLowerCase()) {
                        showSuggestion(suggested, "автоисправление");
                    }
                }
            } else if (brandKey && !rest && value.length >= 3) {
                let key = brandKey.toLowerCase();
                if (!MODELS[key] && MODELS[key.replace(/-/g, "")]) {
                    key = key.replace(/-/g, "");
                }
                const models = MODELS[key];
                if (models) {
                    models.slice(0, 5).forEach(model => {
                        showSuggestion(`${prettyBrand(brandKey)} ${model}`, "модель");
                    });
                }
            }
        }

        function showSuggestion(text, label, isJoke = false) {
            const item = document.createElement("div");
            item.className = "suggestion-item" + (isJoke ? " joke" : "");

            const textSpan = document.createElement("span");
            textSpan.textContent = text;

            const labelSpan = document.createElement("span");
            labelSpan.className = "label";
            labelSpan.textContent = label;

            item.appendChild(textSpan);
            item.appendChild(labelSpan);

            item.onclick = () => {
                input.value = text;
                suggestionsBox.classList.remove("visible");
                activeSuggestionIndex = -1;
                updateBrandLogo();
                input.focus();
            };

            suggestionsBox.appendChild(item);
            suggestionsBox.classList.add("visible");
        }

        function navigateSuggestions(direction) {
            const items = suggestionsBox.querySelectorAll(".suggestion-item");
            if (items.length === 0) return;

            if (activeSuggestionIndex >= 0) {
                items[activeSuggestionIndex].classList.remove("active");
            }

            activeSuggestionIndex += direction;
            if (activeSuggestionIndex < 0) activeSuggestionIndex = items.length - 1;
            if (activeSuggestionIndex >= items.length) activeSuggestionIndex = 0;

            items[activeSuggestionIndex].classList.add("active");
        }

        function applyActiveSuggestion() {
            const items = suggestionsBox.querySelectorAll(".suggestion-item");
            if (activeSuggestionIndex >= 0 && items[activeSuggestionIndex]) {
                items[activeSuggestionIndex].click();
                return true;
            }
            return false;
        }

        function findBrand(modelText) {
            const text = modelText.toLowerCase().trim();

            const egg = checkEasterEgg(text);
            if (egg) {
                return {
                    brand: egg.brand,
                    domain: egg.domain,
                    exact: true,
                    easterEgg: true,
                    message: egg.message
                };
            }

            for (const [brand, domain] of Object.entries(BRANDS)) {
                if (text.startsWith(brand)) {
                    return { brand, domain, exact: true };
                }
            }

            const firstWord = text.split(/[\s\-_]+/)[0];
            let best = null;
            let bestDistance = Infinity;

            for (const [brand, domain] of Object.entries(BRANDS)) {
                const brandFirstWord = brand.split(/[\s\-_]+/)[0];
                const distFull = levenshtein(firstWord, brand);
                const distFirst = levenshtein(firstWord, brandFirstWord);
                const dist = Math.min(distFull, distFirst);

                if (dist < bestDistance) {
                    bestDistance = dist;
                    best = { brand, domain, distance: dist };
                }
            }

            const threshold = firstWord.length <= 4 ? 1 : 3;

            if (best && bestDistance <= threshold) {
                return { ...best, exact: false };
            }
            return null;
        }

        function updateBrandLogo() {
            const model = input.value.trim();
            if (!model) {
                brandLogo.classList.remove("visible");
                currentLogoUrl = "";
                return;
            }

            const found = findBrand(model);
            if (!found) {
                brandLogo.classList.remove("visible");
                currentLogoUrl = "";
                return;
            }

            const logoUrl = `https://img.logokit.com/${found.domain}?token=${LOGOKIT_TOKEN}`;
            if (logoUrl === currentLogoUrl) return;
            currentLogoUrl = logoUrl;

            brandLogo.onload = () => brandLogo.classList.add("visible");
            brandLogo.onerror = () => brandLogo.classList.remove("visible");
            brandLogo.src = logoUrl;
        }

                status.textContent = "⚠️ Пожалуйста, введите модель роутера";
                status.className = "status warning";
                input.focus();
                return;
            }

            const shop = SHOPS[shopKey];
            const url = shop.url(model);

            } else {

                status.className = "status warning";

        async function checkShodan() {
            const value = input.value.trim();

            if (!value) {
                status.textContent = "⚠️ Введите IP или домен для проверки";
                status.className = "status warning";
                input.focus();
                return;
            }

            const ipRegex = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            const domainRegex = /^([a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$/;

            let ip = null;
            let targetLabel = value;

            if (ipRegex.test(value)) {
                ip = value;
                targetLabel = `${value} (IP)`;
            } else if (domainRegex.test(value)) {
                status.innerHTML = `🔎 Определяю IP для <b>${value}</b>...`;
                status.className = "status";

                try {
                    const dohUrl = `https://dns.google/resolve?name=${encodeURIComponent(value)}&type=A`;
                    const dohResponse = await fetch(`${WORKER_URL}/?url=${encodeURIComponent(dohUrl)}`);
                    const dohData = await dohResponse.json();

                    if (!dohData.Answer || dohData.Answer.length === 0) {
                        status.innerHTML = `⚠️ Не удалось определить IP для <b>${value}</b>.<br><small>Проверьте домен или введите IP вручную.</small>`;
                        status.className = "status warning";
                        return;
                    }

                    const aRecord = dohData.Answer.find(r => r.type === 1);
                    if (!aRecord) {
                        status.innerHTML = `⚠️ У <b>${value}</b> нет A-записи (IPv4).<br><small>Возможно, только IPv6.</small>`;
                        status.className = "status warning";
                        return;
                    }

                    ip = aRecord.data;
                    targetLabel = `${value} → ${ip}`;

                } catch (error) {
                    console.error("DNS resolve error:", error);
                    status.innerHTML = `❌ Ошибка DNS-запроса: ${error.message}`;
                    status.className = "status error";
                    return;
                }
            } else {
                status.innerHTML = `⚠️ <b>${value}</b> не похоже ни на IP, ни на домен.`;
                status.className = "status warning";
                return;
            }

            status.innerHTML = `📡 Проверяю <b>${targetLabel}</b> через Shodan...`;
            status.className = "status";

            try {
                const shodanUrl = `https://internetdb.shodan.io/${ip}`;
                const response = await fetch(`${WORKER_URL}/?url=${encodeURIComponent(shodanUrl)}`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const data = await response.json();

                if (data.detail) {
                    status.innerHTML = `ℹ️ <b>${targetLabel}</b>: ${data.detail}`;
                    status.className = "status";
                    return;
                }

                const ports = data.ports || [];
                const vulns = data.vulns || [];
                const hostnames = data.hostnames || [];
                const tags = data.tags || [];

                let msg = `📡 <b>${targetLabel}</b><br>`;
                msg += `Портов: <b>${ports.length}</b>`;
                if (ports.length > 0) {
                    msg += ` <small>(${ports.slice(0, 8).join(", ")}${ports.length > 8 ? "…" : ""})</small>`;
                }
                msg += `<br>Уязвимостей: <b>${vulns.length}</b>`;
                if (vulns.length > 0) {
                    msg += ` <small>(${vulns.slice(0, 3).join(", ")}${vulns.length > 3 ? "…" : ""})</small>`;
                }
                if (hostnames.length > 0) {
                    msg += `<br>Hostname: <small>${hostnames.slice(0, 3).join(", ")}</small>`;
                }
                if (tags.length > 0) {
                    msg += `<br>Теги: <small>${tags.join(", ")}</small>`;
                }

                status.innerHTML = msg;
                status.className = vulns.length > 0 ? "status error" : "status success";

                addToHistory(value, "shodan");

            } catch (error) {
                console.error("Shodan error:", error);
                status.innerHTML = `❌ Ошибка Shodan: ${error.message}`;
                status.className = "status error";
            }
        }

        async function checkDefaults() {
            const model = input.value.trim();

            if (!model) {
                status.textContent = "⚠️ Введите модель роутера (например, TP-Link Archer AX55)";
                status.className = "status warning";
                input.focus();
                return;
            }

            status.innerHTML = `🎯 Ищу данные для <b>${model}</b>...`;
            status.className = "status";

            const parts = model.split(/\s+/);
            let brand = parts[0];
            let modelName = parts.slice(1).join(" ");

            if (!modelName) {
                const found = findBrand(model);
                if (found) {
                    brand = found.brand;
                    modelName = model;
                } else {
                    modelName = model;
                }
            }

            const apiUrl = `https://ssid.ai/api/v1/device?brand=${encodeURIComponent(brand)}&model=${encodeURIComponent(modelName)}`;
            const proxyUrl = `${WORKER_URL}/?url=${encodeURIComponent(apiUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();

                if (response.status === 409 && data.candidates) {
                    let msg = `🤔 Модель неоднозначная. Нашлось несколько вариантов:<br>`;
                    data.candidates.forEach((c) => {
                        msg += `<a href="${c.url}" target="_blank" style="color:#a5b4fc">${c.slug}</a><br>`;
                    });
                    status.innerHTML = msg;
                    status.className = "status warning";
                    return;
                }

                if (data && data.slug) {
                    let msg = `🎯 <b>${data.brand} ${data.modelName}</b><br>`;
                    if (data.defaultGatewayIp) msg += `IP входа: <code>${data.defaultGatewayIp}</code><br>`;
                    if (data.loginHost) msg += `Хост: <code>${data.loginHost}</code><br>`;
                    if (data.defaultUsername) msg += `Логин: <code>${data.defaultUsername}</code><br>`;
                    if (data.defaultPassword) msg += `Пароль: <code>${data.defaultPassword}</code><br>`;
                    if (data.credTypeMeaning) msg += `<small>${data.credTypeMeaning}</small><br>`;

                    if (data.url) {
                        msg += `<br><a href="${data.url}" target="_blank" style="color:#a5b4fc">Открыть на ssid.ai →</a>`;
                    }
                    status.innerHTML = msg;
                    status.className = "status success";

                    addToHistory(model, "ssid");
                    return;
                }

                status.innerHTML = `ℹ️ Для <b>${model}</b> данных не найдено.<br><small>Попробуй ввести бренд и модель точнее.</small>`;
                status.className = "status";

            } catch (error) {
                console.error("ssid.ai error:", error);
                status.innerHTML = `❌ Ошибка запроса к ssid.ai: ${error.message}`;
                status.className = "status error";
            }
        }

        // --- Трассировка через Globalping ---
        async function runTraceroute() {
            const value = input.value.trim();

            if (!value) {
                status.textContent = "⚠️ Введите домен или IP для трассировки";
                status.className = "status warning";
                input.focus();
                return;
            }

            const ipRegex = /^(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
            const domainRegex = /^([a-zA-Z0-9]([a-zA-Z0-9\-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,}$/;

            if (!ipRegex.test(value) && !domainRegex.test(value)) {
                status.innerHTML = `⚠️ <b>${value}</b> не похоже ни на IP, ни на домен.`;
                status.className = "status warning";
                return;
            }

            status.innerHTML = `🗺 Запускаю трассировку до <b>${value}</b>...<br><small>Это может занять 5–15 секунд</small>`;
            status.className = "status";

            try {
                const response = await fetch(`${WORKER_URL}/api/trace`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ target: value })
                });

                const data = await response.json();

                let hops = [];
                if (data.results && data.results.length > 0) {
                    const probeResult = data.results[0].result;
                    if (probeResult && probeResult.hops) {
                        hops = probeResult.hops;
                    }
                }

                if (hops.length === 0) {
                    status.innerHTML = `ℹ️ Трассировка до <b>${value}</b> не вернула данных.<br><small>Возможно, узел блокирует запросы.</small>`;
                    status.className = "status";
                    return;
                }

                let msg = `<div>🗺 <b>Трассировка ${value}</b> (${hops.length} хопов)</div>`;
                msg += `<div class="hop-list">`;

               hops.forEach((hop, index) => {
    const hopNum = index + 1;

    // Универсальный парсер RTT: число, объект {rtt}, строка или null
    let rtt = "—";
    if (Array.isArray(hop.timings) && hop.timings.length > 0) {
        const t = hop.timings.find(x => x !== null && x !== undefined);
        if (typeof t === "number") {
            rtt = `${t.toFixed(1)} ms`;
        } else if (t && typeof t === "object") {
            // Иногда приходит {rtt: 12.3} или {value: 12.3}
            const val = t.rtt ?? t.value ?? t.time;
            if (typeof val === "number") {
                rtt = `${val.toFixed(1)} ms`;
            }
        } else if (typeof t === "string") {
            rtt = t;
        }
    } else if (typeof hop.timings === "number") {
        rtt = `${hop.timings.toFixed(1)} ms`;
    }

    const addr = hop.resolvedAddress || hop.address || "—";
    msg += `<div class="hop-item"><span class="hop-num">${hopNum}</span><span>${addr}</span><span style="margin-left:auto;color:#a5b4fc">${rtt}</span></div>`;
});

                msg += `</div>`;
                status.innerHTML = msg;
                status.className = "status success";

                addToHistory(value, "trace");

            } catch (error) {
                console.error("Traceroute error:", error);
                status.innerHTML = `❌ Ошибка трассировки: ${error.message}`;
                status.className = "status error";
            }
        }

        // --- История ---
        const STORAGE_KEY = "routerHistory";
        const MAX_HISTORY = 20;

        const historyList = document.getElementById("historyList");

        function loadHistory() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : [];
            } catch (e) {
                console.error("Ошибка чтения истории:", e);
                return [];
            }
        }

        function saveHistory(history) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
            } catch (e) {
                console.error("Ошибка сохранения истории:", e);
            }
        }

        function addToHistory(model, action) {
            let history = loadHistory();

            history = history.filter(item =>
                item.model.toLowerCase() !== model.toLowerCase()
            );

            history.unshift({
                model: model,
                action: action,
                time: Date.now()
            });

            if (history.length > MAX_HISTORY) {
                history = history.slice(0, MAX_HISTORY);
            }

            saveHistory(history);
            renderHistory();
        }

        function removeFromHistory(model, time) {
            let history = loadHistory();
            history = history.filter(item => !(item.model === model && item.time === time));
            saveHistory(history);
            renderHistory();
        }

        function clearHistory() {
            if (!confirm("Удалить всю историю?")) return;
            localStorage.removeItem(STORAGE_KEY);
            renderHistory();
        }

        function replayHistory(model, action) {
            input.value = model;
            updateBrandLogo();

            switch (action) {
                case "dns":    searchIn("dns"); break;
                case "mvideo": searchIn("mvideo"); break;
                case "citilink": searchIn("citilink"); break;
                case "ozon":   searchIn("ozon"); break;
                case "all":    searchAll(); break;
                case "shodan": checkShodan(); break;
                case "ssid":   checkDefaults(); break;
                case "pppoe":  searchGoogleSetup(); break;
                case "trace":  runTraceroute(); break;
                default:       searchIn("dns");
            }
        }

        function formatTime(timestamp) {
            const diff = Date.now() - timestamp;
            const min = Math.floor(diff / 60000);
            const hour = Math.floor(diff / 3600000);
            const day = Math.floor(diff / 86400000);

            if (min < 1) return "только что";
            if (min < 60) return `${min} мин назад`;
            if (hour < 24) return `${hour} ч назад`;
            if (day < 7) return `${day} дн назад`;

            const d = new Date(timestamp);
            return d.toLocaleDateString("ru-RU", { day: "numeric", month: "short" });
        }

        const ACTION_LABELS = {
            dns: "DNS",
            mvideo: "М.Видео",
            citilink: "Ситилинк",
            ozon: "Ozon",
            all: "Везде",
            shodan: "Shodan",
            ssid: "ssid.ai",
            pppoe: "PPPoE",
            trace: "Трассировка"
        };

        function renderHistory() {
            const history = loadHistory();
            historyList.innerHTML = "";

            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-empty">Пока пусто — что-нибудь найдите</div>';
                return;
            }

            history.forEach(item => {
                const row = document.createElement("div");
                row.className = "history-item";

                const modelSpan = document.createElement("span");
                modelSpan.className = "history-model";
                modelSpan.textContent = item.model;
                modelSpan.title = "Нажмите, чтобы повторить";
                modelSpan.onclick = () => replayHistory(item.model, item.action || "dns");

                row.appendChild(modelSpan);

                if (item.action && ACTION_LABELS[item.action]) {
                    const actionSpan = document.createElement("span");
                    actionSpan.className = "history-action";
                    actionSpan.textContent = ACTION_LABELS[item.action];
                    row.appendChild(actionSpan);
                }

                const timeSpan = document.createElement("span");
                timeSpan.className = "history-time";
                timeSpan.textContent = formatTime(item.time);

                const removeBtn = document.createElement("button");
                removeBtn.className = "remove-btn";
                removeBtn.textContent = "×";
                removeBtn.title = "Удалить";
                removeBtn.onclick = () => removeFromHistory(item.model, item.time);

                row.appendChild(timeSpan);
                row.appendChild(removeBtn);
                historyList.appendChild(row);
            });
        }

        // --- Слушатели ---
        input.addEventListener("input", () => {
            updateBrandLogo();
            updateSuggestions();
        });

        input.addEventListener("keydown", (e) => {
            if (e.key === "ArrowDown") {
                e.preventDefault();
                navigateSuggestions(1);
                return;
            }
            if (e.key === "ArrowUp") {
                e.preventDefault();
                navigateSuggestions(-1);
                return;
            }
            if (e.key === "Escape") {
                suggestionsBox.classList.remove("visible");
                activeSuggestionIndex = -1;
                return;
            }
            if (e.key === "Enter") {
                if (applyActiveSuggestion()) {
                    e.preventDefault();
                    return;
                }
                if (e.ctrlKey) {
                    e.preventDefault();
                    searchAll();
                } else {
                    searchIn("dns");
                }
            }
        });

        document.addEventListener("click", (e) => {
            if (!e.target.closest(".input-wrapper")) {
                suggestionsBox.classList.remove("visible");
                activeSuggestionIndex = -1;
            }
        });

        // --- Инициализация ---
        renderHistory();
        setInterval(renderHistory, 60000);
        
    </script>
